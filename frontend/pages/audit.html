<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MedScribe — Audit Log</title>
  <link rel="stylesheet" href="../css/style.css?v=4" />
  <script src="../js/custom-select.js" defer></script>
  <style>
    .audit-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    .audit-table th {
      text-align: left;
      padding: 8px 10px;
      color: var(--slate);
      font-weight: 600;
      border-bottom: 2px solid var(--border);
      white-space: nowrap;
    }

    .audit-table td {
      padding: 10px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
      word-break: break-word;
      overflow-wrap: anywhere;
    }
    @media (min-width: 701px) {
      .audit-table { table-layout: fixed; }
      .audit-table th:nth-child(1), .audit-table td:nth-child(1) { width: 15%; }
      .audit-table th:nth-child(2), .audit-table td:nth-child(2) { width: 15%; }
      .audit-table th:nth-child(3), .audit-table td:nth-child(3) { width: 10%; }
      .audit-table th:nth-child(4), .audit-table td:nth-child(4) { width: 15%; }
      .audit-table th:nth-child(5), .audit-table td:nth-child(5) { width: 20%; }
      .audit-table th:nth-child(6), .audit-table td:nth-child(6) { width: 25%; }
    }

    .audit-table tr:last-child td {
      border-bottom: none;
    }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .action-badge {
      display: inline-block;
      max-width: 100%;
      padding: 3px 10px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      vertical-align: middle;
    }

    .badge-green { background: #dcfce7; color: #16a34a; }
    .badge-red { background: #fee2e2; color: #dc2626; }
    .badge-blue { background: #dbeafe; color: #2563eb; }
    .badge-orange { background: #ffedd5; color: #ea580c; }
    .badge-purple { background: #f3e8ff; color: #9333ea; }
    .badge-grey { background: #f1f5f9; color: #64748b; }

    .filter-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr auto;
      gap: 12px;
      align-items: end;
      margin-bottom: 20px;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .summary-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      text-align: center;
    }

    .summary-card .count {
      font-size: 2rem;
      font-weight: 700;
      color: var(--navy);
    }

    .summary-card .label {
      font-size: 13px;
      color: var(--slate);
      margin-top: 4px;
    }

    .pagination {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    @media (max-width: 900px) {
      .filter-grid { grid-template-columns: 1fr 1fr; }
      .summary-grid { grid-template-columns: 1fr 1fr; }
    }

    @media (max-width: 600px) {
      .filter-grid { grid-template-columns: 1fr; }
      .summary-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>

<body>
  <div class="app-shell">

    <header class="topbar">
      <div style="display:flex;align-items:center;gap:10px">
        <button class="hamburger-btn" onclick="toggleSidebar()" aria-label="Toggle menu">
          <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
        <div class="topbar-brand">Med<span>Scribe</span></div>
      </div>
      <div class="topbar-doctor">
        <span><strong id="topbar-doctor-name"></strong></span>
        <div class="topbar-divider"></div>
        <span id="topbar-clinic" style="color:var(--slate)"></span>
        <button class="notif-bell-btn" id="notif-bell-btn" onclick="toggleNotifPanel()" style="display:none">
          <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
          </svg>
          <span class="notif-badge" id="notif-badge">0</span>
        </button>
        <button class="btn-logout" onclick="logout()">Sign out</button>
      </div>
      <button class="topbar-profile-btn" onclick="toggleProfileMenu()" aria-label="Profile">
        <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="8" r="4" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 20c0-4 4-6 8-6s8 2 8 6" />
        </svg>
        <span class="profile-dot" id="profile-dot"></span>
      </button>
    </header>

    <div class="notif-backdrop" id="notif-backdrop" onclick="closeNotifPanel()"></div>
    <div class="notif-panel" id="notif-panel">
      <div class="notif-panel-header">
        <h3 style="margin:0;font-size:15px">Notifications</h3>
        <div style="display:flex;gap:10px;align-items:center">
          <button class="btn btn-outline btn-sm" onclick="markAllNotifsRead()">Mark all read</button>
          <button class="modal-close" onclick="closeNotifPanel()">×</button>
        </div>
      </div>
      <div class="notif-panel-body" id="notif-panel-body">
        <p style="color:var(--slate-light);padding:20px;text-align:center;font-size:13px">Loading…</p>
      </div>
    </div>

    <div class="sidebar-backdrop" id="profile-menu-backdrop" onclick="closeProfileMenu()" style="display:none"></div>
    <div class="profile-menu" id="profile-menu">
      <div class="profile-menu-header">
        <strong id="profile-menu-name"></strong>
        <span id="profile-menu-clinic"></span>
      </div>
      <button class="profile-menu-item" onclick="closeProfileMenu(); toggleNotifPanel()">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
        Notifications
        <span class="profile-menu-badge" id="profile-menu-notif-badge" style="display:none">0</span>
      </button>
      <button class="profile-menu-item" onclick="window.location.href='analytics.html?section=settings'">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><circle cx="12" cy="12" r="3"/></svg>
        Settings
      </button>
      <button class="profile-menu-item" onclick="openEditDetailsModal()">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        Edit My Details
      </button>
      <button class="profile-menu-item danger" onclick="logout()">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
        Sign out
      </button>
    </div>

    <nav class="sidebar" id="app-sidebar"></nav>

    <div class="sidebar-backdrop" id="sidebar-backdrop" onclick="closeSidebar()"></div>

    <nav class="bottom-nav" id="app-bottom-nav"></nav>

    <div class="mobile-menu-sheet" id="mobile-menu-sheet">
      <div class="mobile-menu-header">
        <h2>More</h2>
        <button class="mobile-menu-close" onclick="closeMobileMenu()">×</button>
      </div>
      <div class="mobile-menu-body" id="app-mobile-menu-body"></div>
    </div>

    <main class="main-content">
      <div class="content-inner">

        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px">
          <div>
            <h1 style="font-size:1.75rem;font-weight:700;color:var(--navy)">Audit Log</h1>
            <div style="color:var(--slate);font-size:14px;margin-top:4px" id="audit-scope-label">Loading...</div>
          </div>
          <button class="btn btn-outline" onclick="exportCSV()">Export CSV</button>
        </div>

        <!-- Summary Cards -->
        <div class="summary-grid" id="summary-grid">
          <div class="summary-card">
            <div class="count" id="s-total">—</div>
            <div class="label">Total Events</div>
          </div>
          <div class="summary-card">
            <div class="count" id="s-accounts">—</div>
            <div class="label">Account Changes</div>
          </div>
          <div class="summary-card">
            <div class="count" id="s-prescriptions">—</div>
            <div class="label">Prescriptions Confirmed</div>
          </div>
          <div class="summary-card">
            <div class="count" id="s-voids">—</div>
            <div class="label">Consultations Voided</div>
          </div>
        </div>

        <!-- Filters -->
        <div class="card" style="margin-bottom:20px">
          <div class="filter-grid">
            <div class="form-group" style="margin:0">
              <label class="form-label">Event Type</label>
              <select class="form-control" id="f-action" onchange="applyFilters()">
                <option value="">All Events</option>
                <option value="account_created">Account Created</option>
                <option value="account_activated">Account Activated</option>
                <option value="account_deactivated">Account Deactivated</option>
                <option value="account_updated">Account Updated</option>
                <option value="role_changed">Role Changed</option>
                <option value="patient_created">Patient Created</option>
                <option value="patient_updated">Patient Updated</option>
                <option value="patient_checked_in">Patient Checked In</option>
                <option value="vitals_recorded">Vitals Recorded</option>
                <option value="post_consult_task_completed">Post-Consult Task Completed</option>
                <option value="prescription_confirmed">Prescription Confirmed</option>
                <option value="consultation_voided">Consultation Voided</option>
                <option value="payment_collected">Payment Collected</option>
                <option value="payment_reverted">Payment Reverted</option>
                <option value="test_fee_paid">Test Fee Paid</option>
                <option value="test_fees_collected">Test Fees Collected</option>
                <option value="test_fees_collected_anyday">Test Fees Collected (Late)</option>
                <option value="medicine_created">Medicine Added</option>
                <option value="medicine_updated">Medicine Updated</option>
                <option value="medicine_deactivated">Medicine Deactivated</option>
                <option value="medicine_stock_added">Medicine Stock Added</option>
                <option value="medicine_fees_collected">Medicine Fees Collected</option>
              </select>
            </div>
            <div class="form-group" style="margin:0">
              <label class="form-label">Category</label>
              <select class="form-control" id="f-target" onchange="applyFilters()">
                <option value="">All Categories</option>
                <option value="doctor">Doctors</option>
                <option value="consultation">Consultations</option>
                <option value="patient">Patients</option>
              </select>
            </div>
            <div class="form-group" style="margin:0">
              <label class="form-label">From Date</label>
              <input class="form-control" type="date" id="f-from" onchange="applyFilters()" />
            </div>
            <div class="form-group" style="margin:0">
              <label class="form-label">To Date</label>
              <input class="form-control" type="date" id="f-to" onchange="applyFilters()" />
            </div>
            <div>
              <button class="btn btn-outline" onclick="clearFilters()">Clear</button>
            </div>
          </div>
        </div>

        <!-- Log Table -->
        <div class="card">
          <div class="table-wrap">
            <table class="audit-table responsive-cards">
              <thead>
                <tr>
                  <th>When</th>
                  <th>Actor</th>
                  <th>Role</th>
                  <th>Event</th>
                  <th>Target</th>
                  <th>Details</th>
                </tr>
              </thead>
              <tbody id="audit-tbody">
                <tr><td colspan="6" style="text-align:center;color:var(--slate);padding:32px">Loading...</td></tr>
              </tbody>
            </table>
          </div>
          <div class="pagination" id="pagination"></div>
        </div>

      </div>
    </main>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/nav-admin.js?v=1"></script>
  <script src="../js/chat-widget.js?v=1"></script>
  <script>
    const doc = getDoctor();
    renderAdminNav('audit');
    if (!doc || !["admin", "sub_admin"].includes(doc.role)) {
      window.location.href = doc?.role === "super_admin" ? "superadmin.html" : "dashboard.html";
    }

    const scopeLabel = "Showing events for your hospital";
    document.getElementById("audit-scope-label").textContent = scopeLabel;

    // Action label map
    const ACTION_LABELS = {
      account_created: "Account Created",
      account_activated: "Account Activated",
      account_deactivated: "Account Deactivated",
      account_updated: "Account Updated",
      role_changed: "Role Changed",
      patient_created: "Patient Created",
      patient_updated: "Patient Updated",
      patient_checked_in: "Patient Checked In",
      vitals_recorded: "Vitals Recorded",
      post_consult_task_completed: "Post-Consult Task Completed",
      prescription_confirmed: "Prescription Confirmed",
      consultation_voided: "Consultation Voided",
      payment_collected: "Payment Collected",
      payment_reverted: "Payment Reverted",
      test_fee_paid: "Test Fee Paid",
      test_fees_collected: "Test Fees Collected",
      test_fees_collected_anyday: "Test Fees Collected (Late)",
      medicine_created: "Medicine Added",
      medicine_updated: "Medicine Updated",
      medicine_deactivated: "Medicine Deactivated",
      medicine_stock_added: "Medicine Stock Added",
      medicine_fees_collected: "Medicine Fees Collected"
    };

    const ACTION_BADGE = {
      account_created: "badge-green",
      account_activated: "badge-green",
      account_deactivated: "badge-red",
      account_updated: "badge-orange",
      role_changed: "badge-purple",
      patient_created: "badge-green",
      patient_updated: "badge-orange",
      patient_checked_in: "badge-green",
      vitals_recorded: "badge-blue",
      post_consult_task_completed: "badge-blue",
      prescription_confirmed: "badge-blue",
      consultation_voided: "badge-red",
      payment_collected: "badge-blue",
      payment_reverted: "badge-red",
      test_fee_paid: "badge-blue",
      test_fees_collected: "badge-blue",
      test_fees_collected_anyday: "badge-blue",
      medicine_created: "badge-green",
      medicine_updated: "badge-orange",
      medicine_deactivated: "badge-red",
      medicine_stock_added: "badge-green",
      medicine_fees_collected: "badge-blue"
    };

    const ROLE_LABELS = {
      super_admin: "Super Admin",
      admin: "Admin",
      sub_admin: "Sub Admin",
      doctor: "Doctor",
      system: "System"
    };

    let currentPage = 1;
    let allLogs = [];

    async function loadSummary() {
      try {
        const data = await api("GET", "/audit/summary");
        document.getElementById("s-total").textContent = data.total_events;
        document.getElementById("s-accounts").textContent =
          (data.action_breakdown["account_created"] || 0) +
          (data.action_breakdown["account_activated"] || 0) +
          (data.action_breakdown["account_deactivated"] || 0) +
          (data.action_breakdown["role_changed"] || 0);
        document.getElementById("s-prescriptions").textContent =
          data.action_breakdown["prescription_confirmed"] || 0;
        document.getElementById("s-voids").textContent =
          data.action_breakdown["consultation_voided"] || 0;
      } catch (e) { }
    }

    async function loadLogs(page = 1) {
      currentPage = page;
      const action = document.getElementById("f-action").value;
      const target = document.getElementById("f-target").value;
      const from = document.getElementById("f-from").value;
      const to = document.getElementById("f-to").value;

      const params = new URLSearchParams({ page, limit: 50 });
      if (action) params.append("action", action);
      if (target) params.append("target_type", target);
      if (from) params.append("from_date", from);
      if (to) params.append("to_date", to);

      const tbody = document.getElementById("audit-tbody");
      tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;color:var(--slate);padding:32px">Loading...</td></tr>`;

      try {
        const data = await api("GET", `/audit/logs?${params.toString()}`);
        allLogs = data.logs || [];

        if (!allLogs.length) {
          tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;color:var(--slate);padding:32px">No events found for the selected filters.</td></tr>`;
          document.getElementById("pagination").innerHTML = "";
          return;
        }

        tbody.innerHTML = allLogs.map(l => `
          <tr>
            <td data-label="When" style="white-space:nowrap;color:var(--slate);font-size:13px">${formatDateTime(l.created_at)}</td>
            <td data-label="Actor" style="font-weight:500">${sanitize(l.actor_name)}</td>
            <td data-label="Role" style="font-size:13px;color:var(--slate)">${ROLE_LABELS[l.actor_role] || l.actor_role}</td>
            <td data-label="Event"><span class="action-badge ${ACTION_BADGE[l.action] || 'badge-grey'}" title="${l.action}">${ACTION_LABELS[l.action] || l.action}</span></td>
            <td data-label="Target" style="font-size:13px">
              <span style="color:var(--slate)">${l.target_type}</span>
              ${l.target_label ? `<br><span style="font-weight:500">${sanitize(l.target_label)}</span>` : ""}
            </td>
            <td data-label="Details" style="font-size:13px;color:var(--slate)">${l.details ? sanitize(l.details) : "—"}</td>
          </tr>
        `).join("");

        renderPagination(data.total, data.page, data.pages);
      } catch (e) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;color:var(--danger);padding:32px">Failed to load logs. ${e.message}</td></tr>`;
      }
    }

    function renderPagination(total, page, pages) {
      const el = document.getElementById("pagination");
      if (pages <= 1) { el.innerHTML = ""; return; }
      let html = "";
      if (page > 1) html += `<button class="btn btn-outline btn-sm" onclick="loadLogs(${page - 1})">← Prev</button>`;
      for (let i = Math.max(1, page - 2); i <= Math.min(pages, page + 2); i++) {
        html += `<button class="btn btn-sm ${i === page ? 'btn-primary' : 'btn-outline'}" onclick="loadLogs(${i})">${i}</button>`;
      }
      if (page < pages) html += `<button class="btn btn-outline btn-sm" onclick="loadLogs(${page + 1})">Next →</button>`;
      el.innerHTML = html;
    }

    function applyFilters() {
      loadLogs(1);
    }

    function clearFilters() {
      document.getElementById("f-action").value = "";
      document.getElementById("f-target").value = "";
      document.getElementById("f-from").value = "";
      document.getElementById("f-to").value = "";
      loadLogs(1);
    }

    function formatDateTime(iso) {
      const ist = /[+-]\d\d:\d\d$|Z$/.test(iso) ? iso : iso + "+05:30";
      const d = new Date(ist);
      return d.toLocaleString("en-IN", {
        timeZone: "Asia/Kolkata",
        day: "2-digit", month: "short", year: "numeric",
        hour: "2-digit", minute: "2-digit", hour12: true
      });
    }

    function exportCSV() {
      if (!allLogs.length) { toast("No logs to export.", "error"); return; }
      const headers = ["When", "Actor", "Role", "Event", "Target Type", "Target", "Details"];
      const rows = allLogs.map(l => [
        formatDateTime(l.created_at),
        l.actor_name,
        ROLE_LABELS[l.actor_role] || l.actor_role,
        ACTION_LABELS[l.action] || l.action,
        l.target_type,
        l.target_label || "",
        l.details || ""
      ].map(v => `"${String(v).replace(/"/g, '""')}"`).join(","));
      const csv = [headers.join(","), ...rows].join("\n");
      const blob = new Blob([csv], { type: "text/csv" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `medscribe-audit-${new Date().toISOString().slice(0, 10)}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    }

    // Init
    fillTopbar();

    if (["admin", "sub_admin"].includes(doc?.role)) {
      document.getElementById('notif-bell-btn').style.display = '';
      loadNotifUnreadCount();
      setInterval(loadNotifUnreadCount, 30000);
    }

    async function loadNotifUnreadCount() {
      try {
        const data = await api("GET", "/notifications/unread-count");
        const hasUnread = data.unread_count > 0;
        const badge = document.getElementById('notif-badge');
        if (hasUnread) {
          badge.textContent = data.unread_count > 99 ? '99+' : data.unread_count;
          badge.style.display = 'flex';
        } else {
          badge.style.display = 'none';
        }

        const profileDot = document.getElementById('profile-dot');
        if (profileDot) profileDot.style.display = hasUnread ? 'block' : 'none';

        const menuBadge = document.getElementById('profile-menu-notif-badge');
        if (menuBadge) {
          if (hasUnread) {
            menuBadge.textContent = data.unread_count > 99 ? '99+' : data.unread_count;
            menuBadge.style.display = '';
          } else {
            menuBadge.style.display = 'none';
          }
        }
      } catch (e) { }
    }

    async function toggleNotifPanel() {
      const panel = document.getElementById('notif-panel');
      const backdrop = document.getElementById('notif-backdrop');
      if (panel.classList.contains('open')) {
        closeNotifPanel();
      } else {
        panel.classList.add('open');
        backdrop.classList.add('open');
        await loadNotifList();
      }
    }

    function closeNotifPanel() {
      document.getElementById('notif-panel').classList.remove('open');
      document.getElementById('notif-backdrop').classList.remove('open');
    }

    const NOTIF_ICON = { critical: 'critical', warning: 'warning', info: 'info' };

    async function loadNotifList() {
      const body = document.getElementById('notif-panel-body');
      try {
        const data = await api("GET", "/notifications");
        loadNotifUnreadCount();
        if (!data.notifications.length) {
          body.innerHTML = '<p style="color:var(--slate-light);padding:20px;text-align:center;font-size:13px">You\'re all caught up.</p>';
          return;
        }
        body.innerHTML = data.notifications.map(n => `
          <div class="notif-item ${n.is_read ? '' : 'unread'}" onclick="onNotifClick(${n.id}, '${n.link_type || ''}', ${n.link_id || 'null'})">
            <div class="notif-item-title">
              <span class="notif-dot ${NOTIF_ICON[n.severity] || 'info'}"></span>
              ${sanitize(n.title)}
            </div>
            <div class="notif-item-message">${sanitize(n.message)}</div>
          </div>
        `).join('');
      } catch (e) {
        body.innerHTML = '<p style="color:var(--danger);padding:20px;text-align:center;font-size:13px">Could not load notifications.</p>';
      }
    }

    async function onNotifClick(id, linkType, linkId) {
      try {
        await api("PATCH", `/notifications/${id}/read`, {});
        loadNotifUnreadCount();
        if (linkType === 'medicine') window.location.href = 'medicines.html';
      } catch (e) { }
    }

    async function markAllNotifsRead() {
      try {
        await api("POST", "/notifications/mark-all-read", {});
        loadNotifList();
      } catch (e) { }
    }

    loadSummary();
    loadLogs(1);
  </script>
</body>

</html>
