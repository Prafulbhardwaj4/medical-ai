<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Attendance — MedScribe</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/style.css?v=4" />
  <script src="../js/custom-select.js" defer></script>
    <style>
        @media (max-width: 900px) {
            .att-staff-row {
                flex-direction: column;
                align-items: flex-start !important;
                gap: 8px;
                padding: 14px !important;
                border: 1px solid var(--border);
                border-radius: var(--radius-lg);
                margin-bottom: 10px;
            }
        }

        @media (max-width: 700px) {
            .staff-filter-tabs {
                display: none;
            }

            .staff-filter-select {
                display: block !important;
            }
        }

        .staff-filter-tabs .btn {
            transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
        }

        #attendance-list {
            transition: opacity 0.18s ease;
        }
    </style>
</head>

<body>
    <div class="app-shell">
        <header class="topbar">
            <div style="display:flex;align-items:center;gap:10px">
                <button class="hamburger-btn" id="hamburger-btn" onclick="toggleSidebar()" aria-label="Toggle menu">
                    <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                </button>
                <div class="topbar-brand">Med<span>Scribe</span></div>
            </div>
            <div class="topbar-doctor">
                <span><strong id="topbar-doctor-name"></strong></span>
                <div class="topbar-divider"></div>
                <span id="topbar-clinic" style="color:var(--slate)"></span>
                <button class="notif-bell-btn" id="notif-bell-btn" onclick="toggleNotifPanel()" style="display:none">
                    <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
                    </svg>
                    <span class="notif-badge" id="notif-badge">0</span>
                </button>
                <button class="btn btn-outline btn-sm" onclick="logout()">Sign out</button>
            </div>
            <button class="topbar-profile-btn" onclick="toggleProfileMenu()" aria-label="Profile">
                <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="8" r="4" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 20c0-4 4-6 8-6s8 2 8 6" />
                </svg>
                <span class="profile-dot" id="profile-dot"></span>
            </button>
        </header>

        <div class="notif-backdrop" id="notif-backdrop" onclick="closeNotifPanel()"></div>
        <div class="notif-panel" id="notif-panel">
            <div class="notif-panel-header">
                <h3 style="margin:0;font-size:15px">Notifications</h3>
                <div style="display:flex;gap:10px;align-items:center">
                    <button class="btn btn-outline btn-sm" onclick="markAllNotifsRead()">Mark all read</button>
                    <button class="modal-close" onclick="closeNotifPanel()">×</button>
                </div>
            </div>
            <div class="notif-panel-body" id="notif-panel-body">
                <p style="color:var(--slate-light);padding:20px;text-align:center;font-size:13px">Loading…</p>
            </div>
        </div>

        <div class="sidebar-backdrop" id="profile-menu-backdrop" onclick="closeProfileMenu()" style="display:none">
        </div>
        <div class="profile-menu" id="profile-menu">
            <div class="profile-menu-header">
                <strong id="profile-menu-name"></strong>
                <span id="profile-menu-clinic"></span>
            </div>
            <button class="profile-menu-item" onclick="closeProfileMenu(); toggleNotifPanel()">
                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
                </svg>
                Notifications
                <span class="profile-menu-badge" id="profile-menu-notif-badge" style="display:none">0</span>
            </button>
            <button class="profile-menu-item" onclick="window.location.href='analytics.html?section=settings'">
                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                    <circle cx="12" cy="12" r="3" />
                </svg>
                Settings
            </button>
            <button class="profile-menu-item" onclick="openEditDetailsModal()">
                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                </svg>
                Edit My Details
            </button>
            <button class="profile-menu-item danger" onclick="logout()">
                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                </svg>
                Sign out
            </button>
        </div>
        <nav class="sidebar" id="app-sidebar"></nav>
        <div class="sidebar-backdrop" id="sidebar-backdrop" onclick="closeSidebar()"></div>

        <nav class="bottom-nav" id="app-bottom-nav"></nav>

        <div class="mobile-menu-sheet" id="mobile-menu-sheet">
            <div class="mobile-menu-header">
                <h2>More</h2>
                <button class="mobile-menu-close" onclick="closeMobileMenu()">×</button>
            </div>
            <div class="mobile-menu-body" id="app-mobile-menu-body"></div>
        </div>

        <main class="main-content">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
                <h2 style="margin:0">Current Attendance</h2>
                <button class="btn btn-outline btn-sm" onclick="openHistoryModal()">View
                    History</button>
            </div>
            <div class="chip-scroll staff-filter-tabs" id="staff-filters" style="margin-bottom:16px">
                <button class="btn btn-sm" onclick="setStaffFilter('all')" id="sf-all"
                    style="background:var(--teal);color:white;border-color:var(--teal)">All</button>
                <button class="btn btn-outline btn-sm" onclick="setStaffFilter('doctor')"
                    id="sf-doctor">Doctors</button>
                <button class="btn btn-outline btn-sm" onclick="setStaffFilter('sub_admin')" id="sf-sub_admin">Sub
                    Admins</button>
                <button class="btn btn-outline btn-sm" onclick="setStaffFilter('receptionist')"
                    id="sf-receptionist">Receptionists</button>
                <button class="btn btn-outline btn-sm" onclick="setStaffFilter('nurse')" id="sf-nurse">Nurses</button>
                <button class="btn btn-outline btn-sm" onclick="setStaffFilter('lab')" id="sf-lab">Lab Staff</button>
                <button class="btn btn-outline btn-sm" onclick="setStaffFilter('pharmacy')"
                    id="sf-pharmacy">Pharmacists</button>
            </div>
            <select class="form-control staff-filter-select" id="sf-mobile-select" onchange="setStaffFilter(this.value)"
                style="display:none;margin-bottom:16px">
                <option value="all">All Staff</option>
                <option value="doctor">Doctors</option>
                <option value="sub_admin">Sub Admins</option>
                <option value="receptionist">Receptionists</option>
                <option value="nurse">Nurses</option>
                <option value="lab">Lab Staff</option>
                <option value="pharmacy">Pharmacists</option>
            </select>
            <div class="card">
                <div id="attendance-list">
                    <p style="color:var(--slate)">Loading…</p>
                </div>
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="modal-att-history">
        <div class="modal" style="max-width:780px;max-height:85vh;overflow-y:auto">
            <div class="modal-header">
                <h2>Attendance History</h2>
                <button class="modal-close" onclick="closeHistoryModal()">&times;</button>
            </div>
            <div style="background:var(--smoke);border-radius:var(--radius-lg);padding:18px 20px;margin-bottom:20px">
                <div class="form-row" style="gap:16px;margin-bottom:0">
                    <div class="form-group" style="margin-bottom:0">
                        <label class="form-label">From</label>
                        <input type="date" class="form-control" id="hist-from" onchange="loadHistory()">
                    </div>
                    <div class="form-group" style="margin-bottom:0">
                        <label class="form-label">To</label>
                        <input type="date" class="form-control" id="hist-to" onchange="loadHistory()">
                    </div>
                    <div class="form-group" style="margin-bottom:0">
                    <label class="form-label">Staff</label>
                    <select class="form-control" id="hist-role" onchange="onHistRoleChange()">
                        <option value="all">All Staff</option>
                        <option value="doctor">Doctors</option>
                        <option value="sub_admin">Sub Admins</option>
                        <option value="receptionist">Receptionists</option>
                        <option value="nurse">Nurses</option>
                        <option value="lab">Lab Staff</option>
                        <option value="pharmacy">Pharmacists</option>
                    </select>
                </div>
                <div class="form-group" style="margin-bottom:0">
                    <label class="form-label">Name</label>
                    <select class="form-control" id="hist-doctor" onchange="loadHistory()">
                        <option value="">All Names</option>
                    </select>
                </div>
            </div>
                <p style="font-size:12px;color:var(--slate-light);margin-top:10px;margin-bottom:0">Results update automatically as you change any filter.</p>
            </div>
            <div id="history-list" style="padding:0 2px">
                <p style="color:var(--slate)">Pick a date range to see attendance history.</p>
            </div>
        </div>
    </div>

    <div id="toast"></div>
    <script src="../js/api.js?v=4"></script>
    <script src="../js/nav-admin.js?v=1"></script>
    <script src="../js/chat-widget.js?v=1"></script>
  <script src="../js/suggestion-widget.js?v=1"></script>
    <script>
        const doc = getDoctor();
        renderAdminNav('attendance');
        if (!doc || !["admin", "sub_admin"].includes(doc.role)) window.location.href = "dashboard.html";
        if (!requireAuth()) throw new Error("Not authenticated");
        fillTopbar();

        if (["admin", "sub_admin"].includes(doc?.role)) {
            document.getElementById('notif-bell-btn').style.display = '';
            loadNotifUnreadCount();
            setInterval(loadNotifUnreadCount, 30000);
        }

        async function loadNotifUnreadCount() {
            try {
                const data = await api("GET", "/notifications/unread-count");
                const badge = document.getElementById('notif-badge');
                const dot = document.getElementById('profile-dot');
                const pmBadge = document.getElementById('profile-menu-notif-badge');
                const hasUnread = data.unread_count > 0;
                if (badge) {
                    badge.textContent = data.unread_count > 99 ? '99+' : data.unread_count;
                    badge.style.display = hasUnread ? 'flex' : 'none';
                }
                if (dot) dot.style.display = hasUnread ? 'block' : 'none';
                if (pmBadge) {
                    pmBadge.textContent = data.unread_count > 99 ? '99+' : data.unread_count;
                    pmBadge.style.display = hasUnread ? 'inline-flex' : 'none';
                }
            } catch (e) { }
        }

        async function toggleNotifPanel() {
            const panel = document.getElementById('notif-panel');
            const backdrop = document.getElementById('notif-backdrop');
            if (panel.classList.contains('open')) {
                closeNotifPanel();
            } else {
                panel.classList.add('open');
                backdrop.classList.add('open');
                await loadNotifList();
            }
        }

        function closeNotifPanel() {
            document.getElementById('notif-panel').classList.remove('open');
            document.getElementById('notif-backdrop').classList.remove('open');
        }

        const NOTIF_ICON = { critical: 'critical', warning: 'warning', info: 'info' };

        async function loadNotifList() {
            const body = document.getElementById('notif-panel-body');
            try {
                const data = await api("GET", "/notifications");
                loadNotifUnreadCount();
                if (!data.notifications.length) {
                    body.innerHTML = '<p style="color:var(--slate-light);padding:20px;text-align:center;font-size:13px">You\'re all caught up.</p>';
                    return;
                }
                body.innerHTML = data.notifications.map(n => `
          <div class="notif-item ${n.is_read ? '' : 'unread'}" onclick="onNotifClick(${n.id}, '${n.link_type || ''}', ${n.link_id || 'null'})">
            <div class="notif-item-title">
              <span class="notif-dot ${NOTIF_ICON[n.severity] || 'info'}"></span>
              ${sanitize(n.title)}
            </div>
            <div class="notif-item-message">${sanitize(n.message)}</div>
            <div class="notif-item-time" style="font-size:11px;color:var(--slate-light);margin-top:2px">${formatNotifTimestamp(n.created_at)}</div>
          </div>
        `).join('');
            } catch (e) {
                body.innerHTML = '<p style="color:var(--danger);padding:20px;text-align:center;font-size:13px">Could not load notifications.</p>';
            }
        }

        async function onNotifClick(id, linkType, linkId) {
            try {
                await api("PATCH", `/notifications/${id}/read`, {});
                loadNotifUnreadCount();
                if (linkType === 'medicine') window.location.href = 'medicines.html';
            } catch (e) { }
        }

        async function markAllNotifsRead() {
            try {
                await api("POST", "/notifications/mark-all-read", {});
                loadNotifList();
            } catch (e) { }
        }

        let staffFilter = 'all';
        let allStaff = [];
        function setStaffFilter(f) {
            staffFilter = f;
            ['all', 'doctor', 'sub_admin', 'receptionist', 'nurse', 'lab', 'pharmacy'].forEach(x => {
                const btn = document.getElementById(`sf-${x}`);
                if (!btn) return;
                btn.className = x === f ? 'btn btn-sm' : 'btn btn-outline btn-sm';
                if (x === f) btn.style.cssText = 'background:var(--teal);color:white;border-color:var(--teal)';
                else btn.style.cssText = '';
            });
            const mobileSelect = document.getElementById('sf-mobile-select');
            if (mobileSelect) mobileSelect.value = f;
            const list = document.getElementById('attendance-list');
            list.style.opacity = '0';
            setTimeout(() => {
                renderStaffList();
                list.style.opacity = '1';
            }, 150);
        }
        function renderStaffList() {
            const list = staffFilter === 'all' ? allStaff : allStaff.filter(d => d.role === staffFilter);
            const roleLabels = { doctor: 'Doctor', sub_admin: 'Sub Admin', nurse: 'Nurse', receptionist: 'Receptionist', lab: 'Lab Staff', pharmacy: 'Pharmacist' };
            document.getElementById('attendance-list').innerHTML = list.length ? list.map(d => `
          <div class="att-staff-row" style="display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--border);gap:10px;flex-wrap:wrap">
            <div style="min-width:0">
              <strong>${d.name}</strong>
              <span style="display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;background:#f1f5f9;color:#64748b;margin-left:6px">${roleLabels[d.role] || d.role}</span>
              <div style="color:var(--slate);font-size:13px;margin-top:2px">${d.specialization}${d.room_number && d.room_number !== '—' ? ` · Room ${d.room_number}` : ''}</div>
            </div>
            ${badgeFor(d.status)}
          </div>
        `).join('') : `<p style="color:var(--slate-light);padding:12px 0">No ${staffFilter === 'all' ? 'staff' : staffFilter + 's'} found.</p>`;
        }

        function badgeFor(status) {
            if (status === 'present') return '<span class="badge badge-green">Present</span>';
            if (status === 'on_break') return '<span class="badge badge-amber">On Break</span>';
            if (status === 'off_duty') return '<span class="badge badge-red">Off Duty</span>';
            if (status === 'absent') return '<span class="badge badge-red">Absent</span>';
            return '<span class="badge badge-grey">Not marked</span>';
        }

        async function loadAttendance() {
            try {
                allStaff = await api("GET", "/doctors/attendance/today");
                renderStaffList();
            } catch (e) { toast(e.message, "error"); }
        }

        loadAttendance();
        setInterval(loadAttendance, 30000);

        function openHistoryModal() {
            const today = new Date();
            const monthAgo = new Date(today.getTime() - 30 * 24 * 60 * 60 * 1000);
            document.getElementById('hist-to').value = today.toISOString().slice(0, 10);
            document.getElementById('hist-from').value = monthAgo.toISOString().slice(0, 10);
            document.getElementById('hist-role').value = staffFilter;
            document.getElementById('modal-att-history').classList.add('open');
            loadHistStaffList();
        }
        function closeHistoryModal() {
            document.getElementById('modal-att-history').classList.remove('open');
        }

        let histStaffCache = [];

        async function loadHistStaffList() {
            try {
                histStaffCache = await api("GET", "/admin/doctors");
            } catch (e) { histStaffCache = []; }
            onHistRoleChange();
        }

        function onHistRoleChange() {
            const role = document.getElementById('hist-role').value;
            const nameSel = document.getElementById('hist-doctor');
            const pool = role === 'all' ? histStaffCache : histStaffCache.filter(d => d.role === role);
            nameSel.innerHTML = '<option value="">All Names</option>' +
                pool.map(d => `<option value="${d.id}">${d.title || ''} ${d.name}</option>`).join('');
            loadHistory();
        }

        async function loadHistory() {
            const from = document.getElementById('hist-from').value;
            const to = document.getElementById('hist-to').value;
            const role = document.getElementById('hist-role').value;
            const doctor_id = document.getElementById('hist-doctor').value;
            const el = document.getElementById('history-list');
            el.innerHTML = '<p style="color:var(--slate)">Loading…</p>';
            try {
                const params = { from_date: from, to_date: to, role };
                if (doctor_id) params.doctor_id = doctor_id;
                const qs = new URLSearchParams(params).toString();
                const rows = await api("GET", `/doctors/attendance/history?${qs}`);
                if (!rows.length) {
                    el.innerHTML = '<p style="color:var(--slate-light)">No attendance records in this range.</p>';
                    return;
                }
                el.innerHTML = `
          <table class="data-table" style="width:100%">
            <thead><tr><th>Date</th><th>Name</th><th>Role</th><th>Status</th><th>Shift Started</th></tr></thead>
            <tbody>
              ${rows.map(r => `
                <tr>
                  <td>${new Date(r.date).toLocaleDateString('en-IN', { timeZone: 'Asia/Kolkata', day: '2-digit', month: 'short', year: 'numeric' })}</td>
                  <td>${sanitize(r.name)}</td>
                  <td>${sanitize(r.role || '')}</td>
                  <td>${badgeFor(r.status)}</td>
                  <td>${r.shift_started_at ? new Date(r.shift_started_at).toLocaleTimeString('en-IN', { timeZone: 'Asia/Kolkata', hour: '2-digit', minute: '2-digit' }) : '—'}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
            } catch (e) {
                el.innerHTML = `<p style="color:var(--danger)">${e.message}</p>`;
            }
        }
    </script>
</body>

</html>
