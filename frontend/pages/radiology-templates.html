<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Radiology Templates — MedScribe</title>
  <link rel="stylesheet" href="../css/style.css?v=4" />
  <script src="../js/custom-select.js" defer></script>
  <style>
    .rt-row {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      border-bottom: 1px solid var(--border);
      gap: 150px;
      flex-wrap: wrap;
    }
    .rt-row-meta {
      display: flex;
      gap: 4px;
      flex-wrap: nowrap;
      white-space: nowrap;
    }
    .rt-row-actions {
      display: flex;
      gap: 8px;
    }
    @media (min-width: 901px) {
      .rt-row-main { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
      .rt-row-meta { flex: 0 0 auto; flex-wrap: nowrap; white-space: nowrap; }
      .rt-row-actions { flex: 0 0 170px; max-width: 170px; justify-content: flex-end; margin-left: 16px; }
    }
    @media (max-width: 900px) {
      .rt-row {
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
        padding: 16px;
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        margin-bottom: 10px;
      }
      .rt-row-meta {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        font-size: 12px;
        border-top: 1px solid var(--border);
        border-bottom: 1px solid var(--border);
        padding: 10px 0;
      }
      .rt-row-meta > div {
        background: var(--bg-light, #f1f5f9);
        border-radius: 6px;
        padding: 4px 10px;
      }
      .rt-row-actions { width: 100%; }
      .rt-row-actions .btn { flex: 1; }
      .rt-search-filter-grid { grid-template-columns: 1fr !important; }

      #modal-rt .section-grid-header { display: none; }
      #modal-rt .section-row {
        grid-template-columns: 1fr 30px !important;
        grid-template-areas:
          "name remove"
          "rest rest";
        row-gap: 8px !important;
        display: flex !important;
        flex-wrap: wrap;
      }
      #modal-rt .section-row .section-name { flex: 1 1 100%; }
      #modal-rt .section-row .section-remove-btn { order: 2; flex: 0 0 auto; margin-left: auto; }
      #modal-rt .section-row > textarea { flex: 1 1 100%; order: 1; }
    }
  </style>
</head>

<body>
  <div class="app-shell">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:10px">
        <button class="hamburger-btn" id="hamburger-btn" onclick="toggleSidebar()" aria-label="Toggle menu">
          <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
        <div class="topbar-brand">Med<span>Scribe</span></div>
      </div>
      <div class="topbar-doctor">
        <span><strong id="topbar-doctor-name"></strong></span>
        <div class="topbar-divider"></div>
        <span id="topbar-clinic" style="color:var(--slate)"></span>
        <button class="notif-bell-btn" id="notif-bell-btn" onclick="toggleNotifPanel()" style="display:none">
          <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
          </svg>
          <span class="notif-badge" id="notif-badge">0</span>
        </button>
        <button class="btn-logout" onclick="logout()">Sign out</button>
      </div>
      <button class="topbar-profile-btn" onclick="toggleProfileMenu()" aria-label="Profile">
        <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="8" r="4" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 20c0-4 4-6 8-6s8 2 8 6" />
        </svg>
        <span class="profile-dot" id="profile-dot"></span>
      </button>
    </header>

    <div class="sidebar-backdrop" id="profile-menu-backdrop" onclick="closeProfileMenu()" style="display:none"></div>
    <div class="profile-menu" id="profile-menu">
      <div class="profile-menu-header">
        <strong id="profile-menu-name"></strong>
        <span id="profile-menu-clinic"></span>
      </div>
      <button class="profile-menu-item" onclick="closeProfileMenu(); toggleNotifPanel()">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
        </svg>
        Notifications
        <span class="profile-menu-badge" id="profile-menu-notif-badge" style="display:none">0</span>
      </button>
      <button class="profile-menu-item"
        onclick="closeProfileMenu();window.location.href='analytics.html?section=settings'">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
          <circle cx="12" cy="12" r="3" />
        </svg>
        Settings
      </button>
      <button class="profile-menu-item" onclick="openEditDetailsModal()">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        Edit My Details
      </button>
      <button class="profile-menu-item danger" onclick="logout()">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
        </svg>
        Sign out
      </button>
    </div>

    <div class="notif-panel" id="notif-panel">
      <div class="notif-panel-header">
        <h3 style="margin:0;font-size:15px">Notifications</h3>
        <div style="display:flex;gap:10px;align-items:center">
          <button class="btn btn-outline btn-sm" onclick="markAllNotifsRead()">Mark all read</button>
          <button class="modal-close" onclick="closeNotifPanel()">×</button>
        </div>
      </div>
      <div class="notif-panel-body" id="notif-panel-body">
        <p style="color:var(--slate-light);padding:20px;text-align:center;font-size:13px">Loading…</p>
      </div>
    </div>
    <nav class="sidebar" id="app-sidebar"></nav>
    <div class="sidebar-backdrop" id="sidebar-backdrop" onclick="closeSidebar()"></div>

    <nav class="bottom-nav" id="app-bottom-nav"></nav>

    <div class="mobile-menu-sheet" id="mobile-menu-sheet">
      <div class="mobile-menu-header">
        <h2>More</h2>
        <button class="mobile-menu-close" onclick="closeMobileMenu()">×</button>
      </div>
      <div class="mobile-menu-body" id="app-mobile-menu-body"></div>
    </div>

    <main class="main-content">
      <div class="card">
        <div class="card-header"
          style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
          <h2 style="margin:0">Radiology Templates</h2>
          <div style="display:flex;gap:10px;flex-wrap:wrap">
            <button class="btn btn-primary btn-sm" onclick="openAddModal()">Add Template</button>
          </div>
        </div>

        <div class="rt-search-filter-grid" style="display:grid;grid-template-columns:1fr 200px;gap:10px;margin:16px 0 20px">
          <input class="form-control" id="rt-search" placeholder="Search by template name…" oninput="loadTemplates()" />
          <select class="form-control" id="rt-study-type-filter" onchange="loadTemplates()">
            <option value="">All Study Types</option>
            <option value="xray">X-Ray</option>
            <option value="ct">CT</option>
            <option value="mri">MRI</option>
            <option value="ultrasound">Ultrasound</option>
          </select>
        </div>

        <div id="templates-list">
          <p style="color:var(--slate)">Loading…</p>
        </div>
      </div>
    </main>
  </div>

  <!-- Add/Edit Template Modal -->
  <div class="modal-overlay" id="modal-rt">
    <div class="modal" style="max-width:720px;width:95%">
      <div class="modal-header">
        <h2 id="rt-modal-title">Add Template</h2>
        <button class="modal-close" onclick="closeTemplateModal()">×</button>
      </div>
      <input type="hidden" id="rt-id" />
      <label style="display:block;margin-bottom:6px;font-size:14px;color:var(--slate)">Study Name (what the doctor orders)</label>
      <input class="form-control" id="rt-name" placeholder="e.g. USG Abdomen, X-Ray Chest PA, CT Brain"
        style="margin-bottom:14px" />
      <div class="form-row-3" style="display:flex;gap:12px;margin-bottom:14px">
        <select class="form-control" id="rt-study-type" style="flex:1">
          <option value="xray">X-Ray</option>
          <option value="ct">CT</option>
          <option value="mri">MRI</option>
          <option value="ultrasound">Ultrasound</option>
        </select>
        <input class="form-control" id="rt-fee" type="number" min="0" step="0.01" placeholder="Fee (Rs.)" style="flex:1" />
      </div>

      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <label style="font-size:14px;color:var(--slate)">Sections (e.g. Liver, Gall Bladder, Kidneys…) — each with its
          pre-written "normal" default</label>
        <button class="btn btn-outline btn-sm" onclick="addSectionRow()">+ Add Section</button>
      </div>
      <div class="section-grid-header"
        style="display:grid;grid-template-columns:1fr 2fr 30px;gap:6px;font-size:12px;color:var(--slate);padding:0 0 6px;font-weight:600">
        <div>Section Name</div>
        <div>Default "Normal" Finding Text</div>
        <div></div>
      </div>
      <div id="rt-sections-list"></div>

      <p style="font-size:12px;color:var(--slate);margin:10px 0 0">Impression and Advised are never templated here —
        radiologists always type those fresh per case.</p>

      <div class="err-msg" id="rt-modal-err" style="margin:12px 0"></div>
      <div style="display:flex;gap:12px">
        <button class="btn btn-primary" style="flex:1" onclick="submitTemplateForm()">Save</button>
        <button class="btn btn-outline" style="flex:1" onclick="closeTemplateModal()">Cancel</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>
  <script src="../js/api.js?v=4"></script>
  <script src="../js/nav-admin.js?v=1"></script>
  <script src="../js/tier-catalog.js"></script>
  <script src="../js/upgrade-gate.js"></script>
  <script src="../js/chat-widget.js?v=1"></script>
  <script src="../js/suggestion-widget.js?v=1"></script>
  <script>
    const doc = getDoctor();
    renderAdminNav('radiology-templates');
    if (!doc || !["admin", "sub_admin"].includes(doc.role)) window.location.href = "dashboard.html";
    if (!requireAuth()) throw new Error("Not authenticated");
    fillTopbar();

    if (["admin", "sub_admin", "pharmacy"].includes(getDoctor()?.role)) {
      document.getElementById('notif-bell-btn').style.display = '';
      loadNotifUnreadCount();
      setInterval(loadNotifUnreadCount, 30000);
    }

    async function loadNotifUnreadCount() {
      try {
        const data = await api("GET", "/notifications/unread-count");
        const hasUnread = data.unread_count > 0;
        const badge = document.getElementById('notif-badge');
        if (hasUnread) {
          badge.textContent = data.unread_count > 99 ? '99+' : data.unread_count;
          badge.style.display = 'flex';
        } else {
          badge.style.display = 'none';
        }

        const profileDot = document.getElementById('profile-dot');
        if (profileDot) profileDot.style.display = hasUnread ? 'block' : 'none';

        const menuBadge = document.getElementById('profile-menu-notif-badge');
        if (menuBadge) {
          if (hasUnread) {
            menuBadge.textContent = data.unread_count > 99 ? '99+' : data.unread_count;
            menuBadge.style.display = '';
          } else {
            menuBadge.style.display = 'none';
          }
        }
      } catch (e) { }
    }

    async function toggleNotifPanel() {
      const panel = document.getElementById('notif-panel');
      const backdrop = document.getElementById('notif-backdrop');
      if (panel.classList.contains('open')) {
        closeNotifPanel();
      } else {
        panel.classList.add('open');
        backdrop.classList.add('open');
        await loadNotifList();
      }
    }

    function closeNotifPanel() {
      document.getElementById('notif-panel').classList.remove('open');
      document.getElementById('notif-backdrop').classList.remove('open');
    }

    const NOTIF_ICON = { critical: 'critical', warning: 'warning', info: 'info' };

    async function loadNotifList() {
      const body = document.getElementById('notif-panel-body');
      try {
        const data = await api("GET", "/notifications");
        loadNotifUnreadCount();
        if (!data.notifications.length) {
          body.innerHTML = '<p style="color:var(--slate-light);padding:20px;text-align:center;font-size:13px">You\'re all caught up.</p>';
          return;
        }
        body.innerHTML = data.notifications.map(n => `
          <div class="notif-item ${n.is_read ? '' : 'unread'}" onclick="onNotifClick(${n.id}, '${n.link_type || ''}', ${n.link_id || 'null'})">
            <div class="notif-item-title">
              <span class="notif-dot ${NOTIF_ICON[n.severity] || 'info'}"></span>
              ${sanitize(n.title)}
            </div>
            <div class="notif-item-message">${sanitize(n.message)}</div>
            <div class="notif-item-time" style="font-size:11px;color:var(--slate-light);margin-top:2px">${formatNotifTimestamp(n.created_at)}</div>
          </div>
        `).join('');
      } catch (e) {
        body.innerHTML = '<p style="color:var(--danger);padding:20px;text-align:center;font-size:13px">Could not load notifications.</p>';
      }
    }

    async function onNotifClick(id, linkType, linkId) {
      try {
        await api("PATCH", `/notifications/${id}/read`, {});
        loadNotifUnreadCount();
        if (linkType === 'medicine') {
          window.location.href = 'medicines.html';
        }
      } catch (e) { }
    }

    async function markAllNotifsRead() {
      try {
        await api("POST", "/notifications/mark-all-read", {});
        loadNotifList();
      } catch (e) { }
    }

    const STUDY_TYPE_LABEL = { xray: 'X-Ray', ct: 'CT', mri: 'MRI', ultrasound: 'Ultrasound' };
    let currentSections = [];

    function addSectionRow() {
      currentSections.push({ name: '', default_finding_text: '' });
      renderSectionRows();
    }

    function removeSectionRow(i) {
      currentSections.splice(i, 1);
      renderSectionRows();
    }

    function renderSectionRows() {
      const el = document.getElementById('rt-sections-list');
      el.innerHTML = currentSections.map((s, i) => `
        <div class="section-row" style="display:grid;grid-template-columns:1fr 2fr 30px;gap:6px;margin-bottom:6px">
          <input class="form-control section-name" placeholder="e.g. Liver" value="${sanitize(s.name)}" oninput="currentSections[${i}].name=this.value" />
          <textarea class="form-control" placeholder="e.g. Is normal in size and shows normal echotexture. No SOL seen." style="min-height:38px" oninput="currentSections[${i}].default_finding_text=this.value">${sanitize(s.default_finding_text)}</textarea>
          <button class="btn btn-outline btn-sm section-remove-btn" onclick="removeSectionRow(${i})" title="Remove">×</button>
        </div>
      `).join('');
    }

    async function loadTemplates() {
      try {
        const params = new URLSearchParams();
        const search = document.getElementById('rt-search').value.trim();
        const studyType = document.getElementById('rt-study-type-filter').value;
        if (search) params.append('search', search);
        if (studyType) params.append('study_type', studyType);

        const items = await api("GET", `/admin/radiology-templates?${params.toString()}`);
        renderTemplates(items);
      } catch (e) { toast(e.message, "error"); }
    }

    function renderTemplates(items) {
      const el = document.getElementById('templates-list');
      if (!items.length) {
        el.innerHTML = '<p style="color:var(--slate-light);padding:12px 0">No templates added yet.</p>';
        return;
      }
      el.innerHTML = items.map(t => `
        <div class="rt-row">
          <div class="rt-row-main">
            <div style="flex:1;min-width:0">
              <strong>${sanitize(t.name)}</strong>
              <span class="badge badge-navy" style="margin-left:8px">${sections_count_badge(t)}</span>
              <div style="font-size:12px;color:var(--slate)">${t.sections.map(s => sanitize(s.name)).join(', ')}</div>
            </div>
          </div>
          <div class="rt-row-meta">
            <div style="font-size:12px;color:var(--slate)">${STUDY_TYPE_LABEL[t.study_type] || t.study_type}</div>
            <div style="font-size:13px">Rs.${t.fee}</div>
          </div>
          <div class="rt-row-actions">
            <button class="btn btn-outline btn-sm" onclick='openEditModal(${JSON.stringify(t)})'>Edit</button>
            <button class="btn btn-outline btn-sm" onclick="deactivateTemplate(${t.id})">Deactivate</button>
          </div>
        </div>
      `).join('');
    }

    function sections_count_badge(t) {
      return `${t.sections.length} section${t.sections.length === 1 ? '' : 's'}`;
    }

    function openAddModal() {
      document.getElementById('rt-modal-title').textContent = 'Add Template';
      document.getElementById('rt-id').value = '';
      document.getElementById('rt-name').value = '';
      document.getElementById('rt-study-type').value = 'ultrasound';
      document.getElementById('rt-fee').value = '';
      currentSections = [];
      addSectionRow();
      document.getElementById('rt-modal-err').textContent = '';
      document.getElementById('modal-rt').classList.add('open');
    }

    function openEditModal(t) {
      document.getElementById('rt-modal-title').textContent = 'Edit Template';
      document.getElementById('rt-id').value = t.id;
      document.getElementById('rt-name').value = t.name || '';
      document.getElementById('rt-study-type').value = t.study_type || 'ultrasound';
      document.getElementById('rt-fee').value = t.fee != null ? t.fee : '';
      currentSections = (t.sections || []).map(s => ({ name: s.name || '', default_finding_text: s.default_finding_text || '' }));
      renderSectionRows();
      document.getElementById('rt-modal-err').textContent = '';
      document.getElementById('modal-rt').classList.add('open');
    }

    function closeTemplateModal() {
      document.getElementById('modal-rt').classList.remove('open');
    }

    async function submitTemplateForm() {
      const id = document.getElementById('rt-id').value;
      const name = document.getElementById('rt-name').value.trim();
      const errEl = document.getElementById('rt-modal-err');
      if (!name) { errEl.textContent = 'Study name is required.'; return; }
      const feeVal = document.getElementById('rt-fee').value;
      if (feeVal === '') { errEl.textContent = 'Fee is required.'; return; }
      if (!currentSections.some(s => s.name.trim())) {
        errEl.textContent = 'Add at least one section.';
        return;
      }

      const payload = {
        name,
        study_type: document.getElementById('rt-study-type').value,
        fee: parseFloat(feeVal),
        sections: currentSections.filter(s => s.name.trim())
      };

      try {
        if (id) {
          await api("PATCH", `/admin/radiology-templates/${id}`, payload);
          toast('Template updated.', 'success');
        } else {
          await api("POST", `/admin/radiology-templates`, payload);
          toast('Template added.', 'success');
        }
        closeTemplateModal();
        loadTemplates();
      } catch (e) { errEl.textContent = e.message; }
    }

    async function deactivateTemplate(id) {
      try {
        await api("DELETE", `/admin/radiology-templates/${id}`);
        toast('Template deactivated.', 'success');
        loadTemplates();
      } catch (e) { toast(e.message, 'error'); }
    }

    loadTemplates();
  </script>
</body>

</html>
