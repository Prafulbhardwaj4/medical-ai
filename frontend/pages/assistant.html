<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assistant Station — MedScribe</title>
  <link rel="stylesheet" href="../css/style.css?v=4" />
  <style>
    .mobile-section { display: none; }
    .mobile-section.active { display: block; }
    @media (min-width: 901px) {
      .mobile-section { display: none !important; margin-bottom: 20px; }
      .mobile-section.d-active { display: block !important; }
      #section-attendance.mobile-section { display: block !important; }
    }

    .doc-picker { position: relative; }
    .doc-picker-btn {
      display: flex; align-items: center; gap: 6px;
      background: var(--white); border: 1.5px solid var(--border);
      border-radius: 999px; padding: 7px 14px; font-size: 13.5px; font-weight: 600;
      color: var(--navy); cursor: pointer; white-space: nowrap;
    }
    .doc-picker-panel {
      display: none; position: absolute; top: calc(100% + 6px); right: 0;
      background: var(--white); border: 1.5px solid var(--border); border-radius: var(--radius);
      box-shadow: 0 8px 24px rgba(0,0,0,0.12); padding: 8px; min-width: 240px; max-height: 320px;
      overflow-y: auto; z-index: 200;
    }
    .doc-picker-panel.open { display: block; }
    /* .app-shell clips overflow — an absolutely-positioned panel that
       tries to extend below the sticky header can get cut off on narrow
       screens. Anchor it to the viewport instead on mobile so it's never
       clipped by an ancestor. */
    @media (max-width: 900px) {
      .doc-picker-panel {
        position: fixed;
        top: 60px;
        left: 12px;
        right: 12px;
        min-width: 0;
        width: auto;
      }
    }
    .doc-picker-row {
      display: flex; align-items: center; gap: 8px; padding: 8px 8px; border-radius: 8px;
      cursor: pointer; font-size: 13.5px;
    }
    .doc-picker-row:hover { background: var(--bg-light, #f8fafc); }
    .doc-picker-row input { pointer-events: none; }
    .doc-picker-status { margin-left: auto; font-size: 11px; }
    .doc-picker-empty-note {
      font-size: 12px; color: var(--slate-light); padding: 6px 8px 2px;
      border-top: 1px solid var(--border); margin-top: 6px;
    }

    .roster-row {
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid var(--border); padding: 12px 0;
    }
    .roster-row:last-child { border-bottom: none; }
    .roster-row.assigned-to-me { background: var(--bg-light, #f8fafc); border-radius: var(--radius); padding: 12px 10px; }

    /* The "Assisting" picker now lives inside the attendance card (see
       #section-attendance) instead of the header, so it no longer needs
       pulling out of .topbar-doctor's mobile display:none. */
    @media (max-width: 900px) {
      .doc-picker-btn { font-size: 12px; padding: 6px 8px; }
    }
    @media (min-width: 901px) {
      /* Let the shared .staff-att-actions { margin-left: auto } rule in
         style.css do its job — this used to override it back to 0,
         which is why the actions block sat left-aligned instead of
         shifting to the right of the card. */
    }
    @media (max-width: 900px) {
      #up-next-btn { width: 100%; }
    }
    @media (min-width: 901px) {
      #up-next-btn { width: auto; display: block; margin-left: auto; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:10px">
        <button class="hamburger-btn" id="hamburger-btn" onclick="toggleSidebar()" aria-label="Toggle menu">
          <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
        <div class="topbar-brand">Med<span>Scribe</span></div>
      </div>
      <div class="topbar-doctor">
        <span><strong id="topbar-doctor-name"></strong></span>
        <div class="topbar-divider"></div>
        <span id="topbar-clinic" style="color:var(--slate)"></span>
        <button class="btn-logout" onclick="logout()">Sign out</button>
      </div>
      <button class="topbar-profile-btn" onclick="toggleProfileMenu()" aria-label="Profile">
        <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="8" r="4" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 20c0-4 4-6 8-6s8 2 8 6" />
        </svg>
      </button>
    </header>

    <div class="sidebar-backdrop" id="profile-menu-backdrop" onclick="closeProfileMenu()" style="display:none"></div>
    <div class="profile-menu" id="profile-menu">
      <div class="profile-menu-header">
        <strong id="profile-menu-name"></strong>
        <span id="profile-menu-clinic"></span>
      </div>
      <button class="profile-menu-item" onclick="openEditDetailsModal()">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
          <circle cx="12" cy="12" r="3" />
        </svg>
        Edit My Details
      </button>
      <button class="profile-menu-item danger" onclick="logout()">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
        </svg>
        Sign out
      </button>
    </div>

    <nav class="sidebar">
      <div class="sidebar-section-label">Navigation</div>
      <div class="nav-item active" id="sidebar-nav-home" onclick="showAssistantDesktopTab('home')">
        <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
        </svg>
        Home
      </div>
      <div class="nav-item" id="sidebar-nav-doctors" onclick="showAssistantDesktopTab('doctors')">
        <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0" />
        </svg>
        Doctors
      </div>
    </nav>

    <div class="sidebar-backdrop" id="sidebar-backdrop" onclick="closeSidebar()"></div>

    <nav class="bottom-nav">
      <button class="bottom-nav-item active" id="tab-btn-home" onclick="showAssistantSection('home')">
        <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
        </svg>
        Home
      </button>
      <button class="bottom-nav-item" id="tab-btn-doctors" onclick="showAssistantSection('doctors')">
        <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0" />
        </svg>
        Doctors
      </button>
      <button class="bottom-nav-item" id="tab-btn-attendance" onclick="showAssistantSection('attendance')">
        <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
        </svg>
        Attendance
      </button>
    </nav>

    <main class="main-content">
      <div class="mobile-section d-active" id="section-attendance">
        <div class="card att-card" style="margin-bottom:20px">
          <div class="card-header" style="margin-bottom:0;border-bottom:none;padding-bottom:0">
            <h2>Today's Status</h2>
          </div>
          <div class="staff-att-status">
            <span class="badge badge-grey" id="nurse-attendance-badge">Not marked</span>
          </div>
          <div class="staff-att-actions" id="nurse-attendance-btns">
            <div class="doc-picker" style="margin:0">
              <button class="doc-picker-btn" onclick="toggleDocPicker(event)" id="doc-picker-btn">
                <span id="doc-picker-label">Assisting: none</span>
                <svg width="12" height="12" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
              </button>
              <div class="doc-picker-panel" id="doc-picker-panel"></div>
            </div>
            <div id="nurse-off-duty-time-line" style="display:none;font-size:13px;color:var(--slate)"></div>
            <button class="btn btn-primary" id="nurse-btn-present" onclick="markNurseAttendance('present')">Mark Present</button>
            <button class="btn btn-outline" id="nurse-btn-break" onclick="markNurseAttendance('on_break')" style="display:none">On Break</button>
            <button class="btn btn-outline" id="nurse-btn-offduty" onclick="markNurseAttendance('off_duty')" style="display:none;color:var(--danger);border-color:var(--danger)">Off Duty</button>
          </div>
        </div>
      </div>

      <div class="mobile-section active d-active" id="section-home">

        <div class="card" id="up-next-card" style="display:none;margin-bottom:16px;background:var(--smoke)">
          <div style="font-size:12px;color:var(--slate);font-weight:600;margin-bottom:8px">UP NEXT</div>
          <p id="up-next-empty-msg" style="display:none;margin:0;color:var(--slate);font-size:14px">No next patient currently.</p>
          <div id="up-next-content" style="display:flex;justify-content:space-between;gap:12px">
            <div>
              <div style="font-size:15px"><strong id="up-next-name"></strong></div>
              <div style="font-size:13px;color:var(--slate);margin-top:2px" id="up-next-uid"></div>
              <div style="font-size:13px;color:var(--slate);margin-top:2px" id="up-next-phone"></div>
            </div>
            <div style="text-align:right">
              <div style="font-size:12px;color:var(--slate);font-weight:600">Vitals</div>
              <div style="margin-top:2px" id="up-next-vitals"></div>
              <div style="font-size:13px;color:var(--slate);margin-top:2px" id="up-next-type"></div>
            </div>
          </div>
          <button class="btn" id="up-next-btn" style="margin-top:12px;background:var(--teal);color:#fff;border:none" onclick="skipUpNext()">Next</button>
        </div>

        <div class="card" id="queue-card-walkin">
          <div class="card-header">
            <h2>Walk-ins</h2>
            <div style="display:flex;align-items:center;gap:10px">
              <span id="queue-count-walkin" style="color:var(--slate);font-size:0.9rem"></span>
              <select id="queue-filter-walkin" class="form-control" style="width:150px;min-width:150px;flex-shrink:0;padding:4px 8px;font-size:0.85rem"
                onchange="renderQueues()">
                <option value="all">All</option>
                <option value="waiting">Waiting</option>
                <option value="consulted">Consulted</option>
              </select>
            </div>
          </div>
          <div class="table-wrap">
            <table id="queue-table-walkin" class="responsive-cards">
              <thead>
                <tr>
                  <th>Token</th><th>Patient</th>
                  <th style="text-align:center">Checked In</th><th>Vitals</th><th>Status</th><th></th>
                </tr>
              </thead>
              <tbody id="queue-tbody-walkin">
                <tr><td colspan="6"><div class="empty-state"><p>Loading…</p></div></td></tr>
              </tbody>
            </table>
          </div>
        </div>

        <div class="card" id="queue-card-online" style="margin-top:16px">
          <div class="card-header">
            <h2>Online Appointments</h2>
            <div style="display:flex;align-items:center;gap:10px">
              <span id="queue-count-online" style="color:var(--slate);font-size:0.9rem"></span>
              <select id="queue-filter-online" class="form-control" style="width:150px;min-width:150px;flex-shrink:0;padding:4px 8px;font-size:0.85rem"
                onchange="renderQueues()">
                <option value="all">All</option>
                <option value="waiting">Waiting</option>
                <option value="consulted">Consulted</option>
              </select>
            </div>
          </div>
          <div class="table-wrap">
            <table id="queue-table-online" class="responsive-cards">
              <thead>
                <tr>
                  <th>Token</th><th>Patient</th>
                  <th style="text-align:center">Est. Time</th><th>Vitals</th><th>Status</th><th></th>
                </tr>
              </thead>
              <tbody id="queue-tbody-online">
                <tr><td colspan="6"><div class="empty-state"><p>Loading…</p></div></td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="mobile-section" id="section-doctors">
        <div class="card">
          <div class="card-header"><h2>Doctor Roster</h2></div>
          <div id="doctor-roster-list"><p style="color:var(--slate)">Loading…</p></div>
        </div>
      </div>
    </main>
  </div>

  <div id="toast"></div>
  <script src="../js/api.js?v=4"></script>
  <script src="../js/tier-catalog.js"></script>
  <script src="../js/upgrade-gate.js"></script>
  <script src="../js/chat-widget.js?v=1"></script>
  <script src="../js/suggestion-widget.js?v=1"></script>
  <script>
    requireAuth();
    fillTopbar();
    if (getDoctor()?.role !== 'assistant') redirectByRole(getDoctor()?.role);

    function showAssistantDesktopTab(id) {
      ['home', 'doctors'].forEach(s => document.getElementById('section-' + s).classList.remove('d-active'));
      document.getElementById('section-' + id).classList.add('d-active');
      ['home', 'doctors'].forEach(t => document.getElementById('sidebar-nav-' + t).classList.toggle('active', t === id));
    }
    if (window.innerWidth >= 901) showAssistantDesktopTab('home');

    function showAssistantSection(id) {
      ['home', 'doctors', 'attendance'].forEach(s => {
        document.getElementById('section-' + s).classList.toggle('active', s === id);
        document.getElementById('tab-btn-' + s).classList.toggle('active', s === id);
      });
    }

    let doctorStatusMap = {};
    let allHospitalDoctors = [];
    let nurseCurrentStatus = 'not_marked';
    let nurseSelectedDoctorIds = [];
    let _queueData = { walk_in: [], online: [] };

    function statusBadgeInfo(doctorId) {
      const info = doctorStatusMap[doctorId];
      if (!info) return { label: 'Unknown', cls: 'badge-grey' };
      if (info.status === 'present') {
        if (info.location === 'emergency') return { label: 'In Emergency', cls: 'badge-red' };
        return info.location === 'on_rounds' ? { label: 'On Round', cls: 'badge-amber' } : { label: 'In Cabin', cls: 'badge-green' };
      }
      if (info.status === 'on_break') return { label: 'On Break', cls: 'badge-amber' };
      if (info.status === 'off_duty') return { label: 'On Leave / Off Duty', cls: 'badge-red' };
      if (info.status === 'away_emergency') return { label: 'Away — Emergency', cls: 'badge-red' };
      return { label: 'Not Marked', cls: 'badge-grey' };
    }

    async function loadDoctorStatuses() {
      try {
        allHospitalDoctors = await api("GET", "/patients/hospital-doctors");
        doctorStatusMap = {};
        allHospitalDoctors.forEach(d => {
          doctorStatusMap[d.id] = { status: d.attendance_status, location: d.doctor_location, name: `${d.title} ${d.name}` };
        });
      } catch (e) { }
    }

    // ---------- Header doctor picker (multi-select) ----------
    function toggleDocPicker(e) {
      e.stopPropagation();
      const panel = document.getElementById('doc-picker-panel');
      panel.classList.toggle('open');
      if (panel.classList.contains('open')) renderDocPicker();
    }
    document.addEventListener('click', (e) => {
      const panel = document.getElementById('doc-picker-panel');
      if (panel && !e.target.closest('.doc-picker')) panel.classList.remove('open');
    });

    function renderDocPicker() {
      const panel = document.getElementById('doc-picker-panel');
      const canPick = nurseCurrentStatus === 'present' || nurseCurrentStatus === 'on_break';
      if (!canPick) {
        panel.innerHTML = `<div class="doc-picker-empty-note" style="border-top:none;padding:6px 8px">Mark yourself present first to choose doctors.</div>`;
        return;
      }
      if (!allHospitalDoctors.length) {
        panel.innerHTML = `<div class="doc-picker-empty-note" style="border-top:none;padding:6px 8px">No doctors found.</div>`;
        return;
      }
      panel.innerHTML = allHospitalDoctors.map(d => {
        const checked = nurseSelectedDoctorIds.includes(d.id);
        const b = statusBadgeInfo(d.id);
        return `
          <div class="doc-picker-row" onclick="toggleDocPickerDoctor(${d.id})">
            <input type="checkbox" ${checked ? 'checked' : ''} />
            <span>${d.title} ${d.name}</span>
            <span class="doc-picker-status badge ${b.cls}">${b.label}</span>
          </div>`;
      }).join('');
    }

    function toggleDocPickerDoctor(id) {
      const idx = nurseSelectedDoctorIds.indexOf(id);
      if (idx === -1) nurseSelectedDoctorIds.push(id); else nurseSelectedDoctorIds.splice(idx, 1);
      renderDocPicker();
      updateDocPickerLabel();
      saveCoverage();
    }

    function updateDocPickerLabel() {
      const label = document.getElementById('doc-picker-label');
      if (!nurseSelectedDoctorIds.length) { label.textContent = 'Assisting: none'; return; }
      if (nurseSelectedDoctorIds.length === 1) {
        const info = doctorStatusMap[nurseSelectedDoctorIds[0]];
        label.textContent = `Assisting: ${info ? info.name : '1 doctor'}`;
      } else {
        label.textContent = `Assisting: ${nurseSelectedDoctorIds.length} doctors`;
      }
    }

    async function saveCoverage() {
      try {
        await markAttendanceCommon(nurseCurrentStatus, null, { doctor_ids: nurseSelectedDoctorIds });
        refreshAll();
      } catch (e) { toast(e.message, "error"); }
    }

    // ---------- Attendance ----------
    async function loadNurseAttendance() {
      try {
        const data = await api("GET", "/doctors/attendance/my-status");
        nurseSelectedDoctorIds = data.coverage?.doctor_ids || [];
        renderNurseBadge(data.status);
        updateDocPickerLabel();
        renderOffDutyTimeLine('nurse-off-duty-time-line', data.expected_off_duty_at);
      } catch (e) { }
    }

    function renderNurseBadge(status) {
      nurseCurrentStatus = status;
      const badge = document.getElementById('nurse-attendance-badge');
      const btnPresent = document.getElementById('nurse-btn-present');
      const btnBreak = document.getElementById('nurse-btn-break');
      const btnOffDuty = document.getElementById('nurse-btn-offduty');
      document.getElementById('nurse-off-duty-time-line').style.display = (status === 'present' || status === 'on_break') ? '' : 'none';
      if (status === 'present') {
        badge.className = 'badge badge-green'; badge.textContent = 'Present';
        btnPresent.style.display = 'none'; btnBreak.style.display = ''; btnOffDuty.style.display = '';
      } else if (status === 'on_break') {
        badge.className = 'badge badge-amber'; badge.textContent = 'On Break';
        btnPresent.textContent = 'Resume'; btnPresent.style.display = ''; btnBreak.style.display = 'none'; btnOffDuty.style.display = '';
      } else if (status === 'off_duty') {
        badge.className = 'badge badge-red'; badge.textContent = 'Off Duty';
        btnPresent.textContent = 'Mark Present'; btnPresent.style.display = ''; btnBreak.style.display = 'none'; btnOffDuty.style.display = 'none';
      } else {
        badge.className = 'badge badge-grey'; badge.textContent = 'Not marked';
        btnPresent.textContent = 'Mark Present'; btnPresent.style.display = ''; btnBreak.style.display = 'none'; btnOffDuty.style.display = 'none';
      }
    }

    async function markNurseAttendance(status) {
      try {
        const alreadyActive = nurseCurrentStatus === "present" || nurseCurrentStatus === "on_break";
        let expected_off_duty_at;
        if (status === 'present' && !alreadyActive) {
          expected_off_duty_at = await openOffDutyTimeModal();
          if (!expected_off_duty_at) return;
        }
        const coverage = status === 'present' ? { doctor_ids: nurseSelectedDoctorIds, expected_off_duty_at } : {};
        await markAttendanceCommon(status, null, coverage);
        renderNurseBadge(status);
        if (status === 'present' || status === 'on_break') {
          try {
            const s = await api("GET", "/doctors/attendance/my-status", null, false, true);
            renderOffDutyTimeLine('nurse-off-duty-time-line', s.expected_off_duty_at);
          } catch (e) { }
        }
        const labels = { present: "Marked present.", on_break: "On break.", off_duty: "Marked off duty." };
        toast(labels[status] || "Status updated.", "success");
        updateDocPickerLabel();
        refreshAll();
        if (status === 'present' && !alreadyActive) {
          await loadDoctorStatuses();
          openCoverageSelectModal();
        }
      } catch (e) { toast(e.message, "error"); }
    }

    function openCoverageSelectModal() {
      const overlay = document.createElement("div");
      overlay.className = "modal-overlay open";
      overlay.id = "modal-coverage-select";
      const rowsHtml = allHospitalDoctors.length ? allHospitalDoctors.map(d => {
        const b = statusBadgeInfo(d.id);
        return `
          <div class="doc-picker-row" style="padding:10px 8px" onclick="toggleCoverageModalDoctor(${d.id})">
            <input type="checkbox" id="cov-chk-${d.id}" ${nurseSelectedDoctorIds.includes(d.id) ? 'checked' : ''} />
            <span>${d.title} ${d.name}</span>
            <span class="doc-picker-status badge ${b.cls}">${b.label}</span>
          </div>`;
      }).join('') : `<p style="color:var(--slate-light);font-size:13px;padding:8px">No doctors found.</p>`;
      overlay.innerHTML = `
        <div class="modal" style="max-width:420px">
          <div class="modal-header" style="border-bottom:none;margin-bottom:6px">
            <h2 style="margin:0;font-size:18px">Which doctor(s) are you covering today?</h2>
          </div>
          <p style="color:var(--slate);font-size:13.5px;margin:0 0 14px">You can change this anytime from the header.</p>
          <div style="max-height:320px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--radius);padding:4px;margin-bottom:16px">${rowsHtml}</div>
          <button type="button" class="btn btn-primary" style="width:100%" id="coverage-modal-save-btn">Done</button>
        </div>
      `;
      document.body.appendChild(overlay);
      overlay.querySelector("#coverage-modal-save-btn").addEventListener("click", () => {
        overlay.remove();
        saveCoverage();
      });
    }

    function toggleCoverageModalDoctor(id) {
      toggleDocPickerDoctor(id);
      const chk = document.getElementById(`cov-chk-${id}`);
      if (chk) chk.checked = nurseSelectedDoctorIds.includes(id);
    }

    // ---------- Queues (same rendering pattern as doctor's own dashboard) ----------
    function vitalsCellHtml(v) {
      if (v.vitals_status === 'done') return '<span class="badge badge-teal">Recorded</span>';
      return '<span class="badge badge-grey">Not recorded</span>';
    }

    function timeLabel(iso) {
      if (!iso) return '—';
      return new Date(iso).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Kolkata' });
    }

    async function sendToVitals(patientId, btn) {
      btn.disabled = true;
      btn.textContent = 'Sending…';
      try {
        await api("POST", `/patients/${patientId}/send-to-nurse`);
        toast("Sent to vitals.", "success");
        loadQueues();
      } catch (e) {
        toast(e.message, "error");
        btn.disabled = false;
        btn.textContent = 'Send to Vitals';
      }
    }

    function renderQueueRow(v, timeField, allowSendToVitals, isReturningToday) {
      const needsVitals = !v.vitals_status || v.vitals_status === 'none';
      const statusCell = v.is_consulted
        ? '<span class="badge badge-teal">Consulted</span>'
        : '<span class="badge badge-amber">Waiting</span>';
      let actionCell = '';
      if (v.is_consulted) {
        actionCell = `<button class="btn btn-primary btn-sm" onclick="sendAgain(${v.checkin_id}, this)">Send Again</button>`;
      } else if (allowSendToVitals && needsVitals) {
        actionCell = `<button class="btn btn-outline btn-sm" onclick="sendToVitals(${v.patient_id}, this)">Send to Vitals</button>`;
      }
      return `
      <tr>
        <td data-label="Token"><strong>${v.token_number || '—'}</strong></td>
        <td data-label="Patient">${v.patient_name}${v.is_emergency ? ' <span class="badge badge-red">Emergency</span>' : ''}${isReturningToday ? ' <span class="badge badge-teal" title="This patient also has another visit today — this is a separate return visit, treat normally">Returning today</span>' : ''}</td>
        <td data-label="${timeField === 'created_at' ? 'Checked In' : 'Est. Time'}" class="col-checkin-time" style="color:var(--slate)">${timeLabel(v[timeField])}</td>
        <td data-label="Vitals">${vitalsCellHtml(v)}</td>
        <td data-label="Status">${statusCell}</td>
        <td data-label="">${actionCell}</td>
      </tr>`;
    }

    async function sendAgain(checkinId, btn) {
      btn.disabled = true;
      btn.textContent = 'Sending…';
      try {
        await api("POST", `/patients/requeue/${checkinId}`);
        toast("Sent back to the doctor — no new token needed.", "success");
        loadQueues();
      } catch (e) {
        toast(e.message, "error");
        btn.disabled = false;
        btn.textContent = 'Send Again';
      }
    }

    function applyQueueFilter(list, filterValue) {
      if (filterValue === 'waiting') return list.filter(v => !v.is_consulted);
      if (filterValue === 'consulted') return list.filter(v => v.is_consulted);
      return list;
    }

    function renderQueues() {
      const walkinAll = _queueData.walk_in || [];
      const onlineAll = _queueData.online || [];

      // A patient appearing more than once today (e.g. an earlier walk-in
      // plus a separate evening online booking) is a genuine return visit,
      // not a duplicate — flag it so the assistant doesn't second-guess it.
      const patientIdCounts = {};
      [...walkinAll, ...onlineAll].forEach(v => { patientIdCounts[v.patient_id] = (patientIdCounts[v.patient_id] || 0) + 1; });

      const walkinFilter = document.getElementById("queue-filter-walkin").value;
      const onlineFilter = document.getElementById("queue-filter-online").value;
      const walkin = applyQueueFilter(walkinAll, walkinFilter);
      const online = applyQueueFilter(onlineAll, onlineFilter);

      document.getElementById("queue-count-walkin").textContent = `${walkin.length} waiting`;
      document.getElementById("queue-count-online").textContent = `${online.length} waiting`;

      const walkinEmptyMsg = walkinAll.length ? 'No patients match this filter.' : 'No patients currently.';
      const onlineEmptyMsg = onlineAll.length ? 'No patients match this filter.' : 'No patients currently.';

      document.getElementById("queue-tbody-walkin").innerHTML = walkin.length
        ? walkin.map(v => renderQueueRow(v, 'created_at', false, patientIdCounts[v.patient_id] > 1)).join('')
        : `<tr><td colspan="6"><div class="empty-state"><p>${walkinEmptyMsg}</p></div></td></tr>`;

      document.getElementById("queue-tbody-online").innerHTML = online.length
        ? online.map(v => renderQueueRow(v, 'booked_time', false, patientIdCounts[v.patient_id] > 1)).join('')
        : `<tr><td colspan="6"><div class="empty-state"><p>${onlineEmptyMsg}</p></div></td></tr>`;

      const upNextCard = document.getElementById('up-next-card');
      const nextPatient = [...walkinAll, ...onlineAll]
        .filter(v => !v.is_consulted && !v.up_next_skip)
        .sort((a, b) => new Date(a.created_at || a.booked_time) - new Date(b.created_at || b.booked_time))[0];
      upNextCard.style.display = '';  // card itself always stays, per spec — only its inner content toggles
      if (nextPatient) {
        document.getElementById('up-next-empty-msg').style.display = 'none';
        document.getElementById('up-next-content').style.display = 'flex';
        document.getElementById('up-next-name').textContent = nextPatient.patient_name;
        document.getElementById('up-next-uid').textContent = nextPatient.patient_uid || '';
        document.getElementById('up-next-phone').textContent = nextPatient.phone || '';
        document.getElementById('up-next-vitals').innerHTML = vitalsCellHtml(nextPatient);
        document.getElementById('up-next-type').textContent = nextPatient.source === 'online' ? '' : 'Walk-in';
        document.getElementById('up-next-btn').dataset.checkinId = nextPatient.checkin_id;
        document.getElementById('up-next-btn').style.display = '';
      } else {
        document.getElementById('up-next-content').style.display = 'none';
        document.getElementById('up-next-empty-msg').style.display = 'block';
        document.getElementById('up-next-btn').style.display = 'none';
      }
    }

    async function skipUpNext() {
      const btn = document.getElementById('up-next-btn');
      const checkinId = btn.dataset.checkinId;
      if (!checkinId) return;
      btn.disabled = true;
      try {
        await api("POST", `/patients/queue/${checkinId}/skip-next`);
        await loadQueues();
      } catch (e) {
        toast(e.message || 'Could not advance to next patient', 'error');
      } finally {
        btn.disabled = false;
      }
    }

    async function loadQueues() {
      try {
        const flat = await api("GET", "/nurses/vitals-queue?include_done=true");
        const mine = flat.filter(v => nurseSelectedDoctorIds.includes(v.doctor_id));
        _queueData = {
          walk_in: mine.filter(v => v.source !== "online"),
          online: mine.filter(v => v.source === "online"),
        };
        renderQueues();
      } catch (e) { toast(e.message, "error"); }
    }

    function renderDoctorRoster() {
      const list = document.getElementById('doctor-roster-list');
      if (!allHospitalDoctors.length) { list.innerHTML = '<p style="color:var(--slate-light)">No doctors found.</p>'; return; }
      const sorted = [...allHospitalDoctors].sort((a, b) => {
        const mineA = nurseSelectedDoctorIds.includes(a.id) ? 0 : 1;
        const mineB = nurseSelectedDoctorIds.includes(b.id) ? 0 : 1;
        return mineA - mineB;
      });
      list.innerHTML = sorted.map(d => {
        const b = statusBadgeInfo(d.id);
        const mine = nurseSelectedDoctorIds.includes(d.id);
        return `
          <div class="roster-row ${mine ? 'assigned-to-me' : ''}">
            <div>
              <strong>${d.title} ${d.name}</strong>
              ${mine ? '<span class="badge badge-navy" style="margin-left:8px">Assisting</span>' : ''}
              <div style="color:var(--slate);font-size:13px;margin-top:4px">${d.specialization || ''}</div>
            </div>
            <span class="badge ${b.cls}">${b.label}</span>
          </div>`;
      }).join('');
    }

    async function refreshAll() {
      await loadDoctorStatuses();
      updateDocPickerLabel();
      await loadQueues();
      renderDoctorRoster();
      loadEmergencyHoldAlerts();
      loadEmergencyAlertForAssistant();
      loadQueues();
    }

    async function loadEmergencyAlertForAssistant() {
      try {
        const data = await api("GET", "/notifications");
        const notifs = data.notifications || [];
        const alerts = notifs.filter(n => n.type === 'emergency_alert_for_assistant' && !n.is_read);
        if (alerts.length && !document.getElementById('modal-assistant-emergency-alert')) {
          openAssistantEmergencyAlertModal(alerts[0]);
        }
      } catch (e) { }
    }

    function openAssistantEmergencyAlertModal(n) {
      const overlay = document.createElement("div");
      overlay.className = "modal-overlay open";
      overlay.id = "modal-assistant-emergency-alert";
      overlay.innerHTML = `
        <div class="modal" style="max-width:400px;text-align:center">
          <div class="modal-header" style="border-bottom:none;margin-bottom:6px;justify-content:space-between;align-items:center">
            <h2 style="margin:0;font-size:18px;color:#dc2626;flex:1;text-align:center">${n.title.replace('🚨 ', '🚨 ')}</h2>
            <button class="modal-close" id="aea-close-btn">&times;</button>
          </div>
          <p style="color:var(--slate);font-size:14px;margin:0 0 22px">${n.message}</p>
          <button type="button" class="btn btn-primary" id="aea-ack-btn" style="background:#dc2626;border-color:#dc2626;width:100%">Acknowledge</button>
        </div>
      `;
      document.body.appendChild(overlay);
      const dismiss = async () => {
        try { await api("PATCH", `/notifications/${n.id}/read`); } catch (e) { }
        overlay.remove();
      };
      overlay.querySelector("#aea-close-btn").addEventListener("click", dismiss);
      overlay.querySelector("#aea-ack-btn").addEventListener("click", dismiss);
    }

    async function loadEmergencyHoldAlerts() {
      try {
        const data = await api("GET", "/notifications");
        const notifs = data.notifications || [];
        const holds = notifs.filter(n => n.type === 'emergency_assistant_hold' && !n.is_read);
        if (holds.length && !document.getElementById('modal-emergency-hold')) {
          openEmergencyHoldModal(holds[0]);
        }
      } catch (e) { }
    }

    function openEmergencyHoldModal(n) {
      const overlay = document.createElement("div");
      overlay.className = "modal-overlay open";
      overlay.id = "modal-emergency-hold";
      overlay.innerHTML = `
        <div class="modal" style="max-width:400px;text-align:center">
          <div class="modal-header" style="border-bottom:none;margin-bottom:6px;justify-content:space-between;align-items:center">
            <h2 style="margin:0;font-size:18px;color:#dc2626;flex:1;text-align:center">${n.title}</h2>
            <button class="modal-close" id="eh-close-btn">&times;</button>
          </div>
          <p style="color:var(--slate);font-size:14px;margin:0 0 22px">${n.message}</p>
          <button type="button" class="btn btn-primary" id="eh-ack-btn" style="background:#dc2626;border-color:#dc2626;width:100%">Acknowledge</button>
        </div>
      `;
      document.body.appendChild(overlay);
      const dismiss = async () => {
        try { await api("PATCH", `/notifications/${n.id}/read`); } catch (e) { }
        overlay.remove();
      };
      overlay.querySelector("#eh-close-btn").addEventListener("click", dismiss);
      overlay.querySelector("#eh-ack-btn").addEventListener("click", dismiss);
    }

    loadNurseAttendance().then(refreshAll);
    setInterval(refreshAll, 15000);
  </script>
</body>
</html>
